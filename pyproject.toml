[project]
name = "kis-mcp-trading"
version = "0.1.0"
description = "KIS Open API 기반 국내 ETF NAV 괴리율 평균회귀 자동매매(시뮬) 시스템"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 정확성 위주로 명시 선택. ruff 기본셋의 DTZ(naive datetime)는 의도적으로 제외 -
# 이 시스템은 KST 로컬 머신에서 naive 로컬시각으로 장 시간을 비교하도록 설계됨.
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["etf_arb", "kis_common"]
